[package]
name = "installer"
description = "Aurora setup: installs, updates and uninstalls the app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Aurora-Setup"
path = "src/main.rs"

[dependencies]
tempfile = "3"
ui.workspace = true
i18n.workspace = true
eframe.workspace = true
egui.workspace = true
directories.workspace = true
flate2.workspace = true
zip.workspace = true
rfd = "0.18"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
