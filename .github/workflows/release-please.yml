# How releases happen:
# 1. Contributors' PRs are merged into main (PR titles like "feat: …", "fix: …").
# 2. release-please keeps one open "chore(main): release X.Y.Z" PR that bumps
#    the version in Cargo.toml and writes CHANGELOG.md from those titles.
# 3. Merging that release PR pushes the bumped Cargo.toml to main; `release.yml`
#    owns tagging vX.Y.Z and publishing all Linux + Windows assets (including
#    SDL3.dll) so the two workflows never race or clobber each other.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
