# Releases happen when the version goes up: bump `version` in Cargo.toml and
# push to main. If there is no tag vX.Y.Z for that version yet, this builds
#   - Linux: Aurora-Linux-x86_64.tar.gz (+ .sha256), an AppImage (+ .zsync + .sha256), an Arch package, a .deb, an RPM and an experimental Flatpak
#   - Windows: the setup, a portable zip and SHA256SUMS.txt (the app's
#     updater checks it)
# in parallel, then tags the commit vX.Y.Z and publishes the complete set.
# Pushes without a version bump only need the separate Build workflow.
#
# Run it by hand (Actions → Release → Run workflow) to build the files; on
# main it publishes only if the version isn't released yet. Run by hand on
# any other branch (or with "Test build" ticked) it publishes a prerelease
# tagged vX.Y.Z-test.N for testers instead: installed copies don't update to
# prereleases, and the real vX.Y.Z stays free for the release from main.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test:
        description: "Test build: publish a prerelease (always on outside main)"
        type: boolean
        default: false

permissions:
  contents: read

# Two quick pushes never race to publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version released yet?
        id: v
        env:
          TEST: ${{ github.event_name == 'workflow_dispatch' && (inputs.test || github.ref != 'refs/heads/main') }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)".*/\1/p' Cargo.toml | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$TEST" = "true" ]; then
            # A test build: its own tag, never the release's.
            echo "tag=v$v-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Test build: publishing prerelease v$v-test.$GITHUB_RUN_NUMBER from ${GITHUB_REF#refs/heads/}."
            exit 0
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already tagged: nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$v is new: building and releasing it."
          fi

  linux:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    # The oldest supported runner: binaries need the glibc they're built on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Headers for the GUI crates (eframe/winit, GTK for tray-icon and rfd,
      # libxdo for global-hotkey) and OpenSSL for native-tls.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libssl-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev libudev-dev

      - name: Build bundled libSDL3.so.0 (gamepad/HIDAPI/haptic/sensor)
        run: |
          v=3.4.18
          tarball="$RUNNER_TEMP/SDL3-$v.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/libsdl-org/SDL/releases/download/release-$v/SDL3-$v.tar.gz"
          echo "9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdl3-src" "$RUNNER_TEMP/sdl3-build"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/sdl3-src" --strip-components=1
          cmake -S "$RUNNER_TEMP/sdl3-src" -B "$RUNNER_TEMP/sdl3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_AUDIO=OFF -DSDL_VIDEO=OFF -DSDL_RENDER=OFF -DSDL_GPU=OFF \
            -DSDL_CAMERA=OFF -DSDL_DIALOG=OFF -DSDL_TRAY=OFF \
            -DSDL_JOYSTICK=ON -DSDL_HAPTIC=ON -DSDL_HIDAPI=ON -DSDL_HIDAPI_LIBUSB=OFF -DSDL_SENSOR=ON
          cmake --build "$RUNNER_TEMP/sdl3-build" --target SDL3-shared
          cp -L "$RUNNER_TEMP/sdl3-build/libSDL3.so.0" "$RUNNER_TEMP/libSDL3.so.0"
          cp "$RUNNER_TEMP/sdl3-src/LICENSE.txt" "$RUNNER_TEMP/SDL3-LICENSE.txt"
          ls -lh "$RUNNER_TEMP/libSDL3.so.0"

      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # steamclient is a Windows DLL (it doesn't link on Linux), so only the
      # app and the steamhost helper (the headless Steam host for DRM games);
      # tests for the crates that are platform-neutral.
      - name: Test
        run: cargo test --release --locked -p i18n -p ui -p vdf -p model -p store -p vk_overlay -p html_shim

      - name: Build
        run: cargo build --release --locked -p aurora -p steamhost -p vk_overlay -p html_shim

      # Ubuntu 22.04 has glibc 2.35, so the binaries also start on older
      # distros (Ubuntu 22.04, Mint 21, Debian 12). Fail if one needs newer.
      - name: Check the glibc the binaries need
        run: |
          max=2.35
          for f in target/release/aurora target/release/steamhost target/release/libVkLayer_aurora_overlay.so target/release/libaurora_htmlsurface.so "$RUNNER_TEMP/libSDL3.so.0"; do
            need=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)
            echo "$f needs glibc $need"
            if [ "$(printf '%s\n%s\n' "$need" "$max" | sort -V | tail -n1)" != "$max" ]; then
              echo "::error::$f needs glibc $need, newer than $max"; exit 1
            fi
          done

      - name: Package
        run: |
          name=Aurora-Linux-x86_64
          mkdir -p dist/$name
          cp target/release/aurora target/release/steamhost target/release/libVkLayer_aurora_overlay.so \
             target/release/libaurora_htmlsurface.so \
             "$RUNNER_TEMP/libSDL3.so.0" "$RUNNER_TEMP/SDL3-LICENSE.txt" \
             README.md LICENSE assets/icon-256.png dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # Newer rustup refuses a host tuple in rust-toolchain.toml's channel; this
    # picks the same GNU toolchain explicitly (it takes priority over the file).
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: MinGW (the project uses the GNU toolchain)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # Use the MSYS2 that ships with the runner instead of downloading it
          # (the download often fails with HTTP 504).
          release: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-i686-gcc mingw-w64-i686-binutils

      - name: Put MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: SDL3 (reads PlayStation/Switch controllers for games)
        shell: pwsh
        run: |
          $v = "3.4.18"
          $zip = "$env:RUNNER_TEMP\sdl3.zip"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$v/SDL3-$v-win32-x64.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "75c2c0fc74e7d1206aaedc22893a35887332f4f85f5c8b74fddc10d177985f2c") { throw "SDL3 zip checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sdl3" -Force
          echo "SIR_SDL3=$env:RUNNER_TEMP\sdl3\SDL3.dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package
        shell: pwsh
        env:
          # 32-bit MinGW, so the setup includes steamclient32.dll for 32-bit games.
          SIR_MINGW32: ${{ steps.msys2.outputs.msys2-location }}\mingw32\bin
        run: cargo xtask package

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/package/dist/*

  publish:
    needs: [version, linux, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the changelog and Linux package recipes.
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Proton games on Linux run with the same steamclient DLLs as Windows
      # (see client::launch): put this commit's into the Linux archive.
      - name: Add the steamclient DLLs to the Linux archive
        run: |
          name=Aurora-Linux-x86_64
          mkdir -p work && tar -C work -xzf dist/$name.tar.gz
          unzip -j -o dist/*-portable.zip steamclient.dll steamclient32.dll -d dlls
          cp dlls/steamclient.dll work/$name/steamclient64.dll
          if [ -f dlls/steamclient32.dll ]; then cp dlls/steamclient32.dll work/$name/; fi
          tar -C work -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
          tar -tzf dist/$name.tar.gz

      # An Arch package of the same files (packaging/arch/PKGBUILD), built in
      # an Arch container. Arch sorts X.Y.ZrcN below X.Y.Z. Preserve the
      # historical pkgrel mapping for releases with a numeric suffix.
      - name: Arch package
        id: arch
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          pkgrel=1
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            pkgver=${BASH_REMATCH[1]}
            pkgrel=$((10#${BASH_REMATCH[2]} + 1))
          else
            pkgver=${VERSION//-/}
          fi
          name=Aurora-Linux-x86_64
          mkdir -p arch
          cp repo/packaging/arch/PKGBUILD arch/
          cp "dist/$name.tar.gz" "arch/$name-${TAG#v}.tar.gz"
          sum=$(cut -d' ' -f1 dist/$name.tar.gz.sha256)
          sed -i -e "s/^pkgver=.*/pkgver=$pkgver/" -e "s/^pkgrel=.*/pkgrel=$pkgrel/" -e "s/^_tag=.*/_tag=$TAG/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" arch/PKGBUILD
          docker run --rm -v "$PWD/arch:/pkg" archlinux:base-devel bash -c \
            'useradd -m build && chown -R build /pkg && cd /pkg && su build -c "makepkg --nodeps --noconfirm"'
          pkg="aurora-bin-$pkgver-$pkgrel-x86_64.pkg.tar.zst"
          cp "arch/$pkg" dist/
          cp arch/PKGBUILD dist/PKGBUILD
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      # A Debian/Ubuntu package of the same files (Ubuntu 22.04+, Mint,
      # Pop!_OS…): built from the Ubuntu 22.04 binaries.
      - name: Debian package
        id: deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name=Aurora-Linux-x86_64
          src=work-deb/$name
          root=deb/aurora
          rm -rf work-deb deb && mkdir -p work-deb && tar -C work-deb -xzf dist/$name.tar.gz
          install -d $root/DEBIAN $root/opt/aurora $root/usr/bin $root/usr/share/applications \
            $root/usr/share/icons/hicolor/256x256/apps $root/usr/share/doc/aurora
          install -m755 $src/aurora $src/steamhost $src/libVkLayer_aurora_overlay.so $src/libaurora_htmlsurface.so $root/opt/aurora/
          if [ -f $src/libSDL3.so.0 ]; then install -m755 $src/libSDL3.so.0 $root/opt/aurora/; fi
          if [ -f $src/SDL3-LICENSE.txt ]; then install -m644 $src/SDL3-LICENSE.txt $root/usr/share/doc/aurora/SDL3-LICENSE.txt; fi
          for dll in steamclient64.dll steamclient32.dll; do
            if [ -f $src/$dll ]; then install -m644 $src/$dll $root/opt/aurora/; fi
          done
          ln -s /opt/aurora/aurora $root/usr/bin/aurora
          if [ -f $src/icon-256.png ]; then install -m644 $src/icon-256.png $root/usr/share/icons/hicolor/256x256/apps/aurora.png; fi
          install -m644 $src/LICENSE $root/usr/share/doc/aurora/copyright
          # StartupWMClass: the window's app id, which still names the settings folder.
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Aurora' 'GenericName=Steam client' \
            'Comment=Unofficial Steam client written in Rust' 'Exec=aurora' 'Icon=aurora' 'Terminal=false' \
            'Categories=Game;' 'StartupWMClass=SteamInRust' > $root/usr/share/applications/aurora.desktop
          {
            echo "Package: aurora"
            echo "Version: $VERSION"
            echo "Architecture: amd64"
            echo "Maintainer: Aurora <mollie2999@users.noreply.github.com>"
            echo "Installed-Size: $(du -sk $root | cut -f1)"
            echo "Depends: libc6 (>= 2.35), libgcc-s1, libssl3, libudev1, libdbus-1-3, libgl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxi6, libxrandr2, libwayland-client0"
            echo "Recommends: ffmpeg, libpulse0"
            echo "Suggests: steam-installer | steam"
            echo "Section: games"
            echo "Priority: optional"
            echo "Homepage: https://github.com/mollie2999/Aurora"
            echo "Description: Unofficial Steam client written in Rust"
            echo " Aurora is a native Steam client: store, library, downloads, friends"
            echo " and chat, and games launched with Steam features (Proton on Linux)."
          } > $root/DEBIAN/control
          deb=aurora_${VERSION}_amd64.deb
          dpkg-deb --root-owner-group --build $root dist/$deb
          dpkg-deb --info dist/$deb && dpkg-deb --contents dist/$deb
          echo "pkg=$deb" >> "$GITHUB_OUTPUT"

      - name: Fedora package
        id: rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p rpm/SOURCES
          cp dist/Aurora-Linux-x86_64.tar.gz rpm/SOURCES/
          cp repo/packaging/fedora/aurora.spec rpm/
          # RPM sorts a tilde prerelease below the final version.
          rpm_version=${VERSION/-/\~}
          docker run --rm -v "$PWD/rpm:/pkg" -e "AURORA_VERSION=$rpm_version" fedora:latest bash -ec '
            dnf -y install rpm-build
            rpmbuild -bb --define "_topdir /pkg" --define "aurora_version $AURORA_VERSION" /pkg/aurora.spec
            rpm -qpl /pkg/RPMS/x86_64/*.rpm
          '
          pkg="aurora-$VERSION-1.x86_64.rpm"
          cp "rpm/RPMS/x86_64/aurora-$rpm_version-1.x86_64.rpm" "dist/$pkg"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: AppImage
        id: appimage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsync desktop-file-utils
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"
          pkg="Aurora-$VERSION-x86_64.AppImage"
          mkdir -p appimage-dist
          APPIMAGETOOL="$tool" bash repo/packaging/appimage/build-appimage.sh \
            dist/Aurora-Linux-x86_64.tar.gz "appimage-dist/$pkg" "$VERSION"
          (cd appimage-dist && sha256sum "$pkg" > "$pkg.sha256")
          mv "appimage-dist/$pkg" "appimage-dist/$pkg.zsync" "appimage-dist/$pkg.sha256" dist/
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Flatpak bundle
        id: flatpak
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform/x86_64/25.08
          pkg="Aurora-$VERSION-x86_64.flatpak"
          mkdir -p flatpak-dist
          bash repo/packaging/flatpak/build-bundle.sh dist/Aurora-Linux-x86_64.tar.gz "flatpak-dist/$pkg"
          (cd flatpak-dist && sha256sum "$pkg" > "$pkg.sha256")
          mv "flatpak-dist/$pkg" "flatpak-dist/$pkg.sha256" dist/
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH_PKG: ${{ steps.arch.outputs.pkg }}
          DEB_PKG: ${{ steps.deb.outputs.pkg }}
          RPM_PKG: ${{ steps.rpm.outputs.pkg }}
          APPIMAGE_PKG: ${{ steps.appimage.outputs.pkg }}
          FLATPAK_PKG: ${{ steps.flatpak.outputs.pkg }}
        run: |
          for file in "Aurora-Setup-$VERSION.exe" "Aurora-$VERSION-portable.zip" SHA256SUMS.txt \
                      Aurora-Linux-x86_64.tar.gz Aurora-Linux-x86_64.tar.gz.sha256 \
                      "$ARCH_PKG" PKGBUILD "$DEB_PKG" "$RPM_PKG" \
                      "$APPIMAGE_PKG" "$APPIMAGE_PKG.zsync" "$APPIMAGE_PKG.sha256" \
                      "$FLATPAK_PKG" "$FLATPAK_PKG.sha256"; do
            if [ ! -s "dist/$file" ]; then
              echo "::error::Missing or empty release asset: $file"
              exit 1
            fi
          done

      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          BRANCH: ${{ github.ref_name }}
          ARCH_PKG: ${{ steps.arch.outputs.pkg }}
          DEB_PKG: ${{ steps.deb.outputs.pkg }}
          RPM_PKG: ${{ steps.rpm.outputs.pkg }}
          APPIMAGE_PKG: ${{ steps.appimage.outputs.pkg }}
          FLATPAK_PKG: ${{ steps.flatpak.outputs.pkg }}
        run: |
          asset="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          {
            echo "## Aurora $VERSION"
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "> **Test build** from \`$BRANCH\` ($GITHUB_SHA). Not offered to installed copies as an update."
              echo
            fi
            # This version's section of CHANGELOG.md (heading "## [X.Y.Z]…").
            awk -v v="[$VERSION]" 'index($0, "## " v) == 1 { f = 1; next } f && /^## / { exit } f' repo/CHANGELOG.md > changes.md
            if [ -s changes.md ]; then
              cat changes.md
              echo
            fi
            echo "### Downloads"
            echo
            echo '| Platform / Build | Download | Notes |'
            echo '| --- | --- | --- |'
            echo "| Windows x86-64 | [Installer]($asset/Aurora-Setup-$VERSION.exe) · [Portable ZIP]($asset/Aurora-$VERSION-portable.zip) · [SHA-256]($asset/SHA256SUMS.txt) | Run the installer or extract the ZIP |"
            echo "| Linux x86-64 (AppImage) | [.AppImage]($asset/$APPIMAGE_PKG) · [.zsync]($asset/$APPIMAGE_PKG.zsync) · [SHA-256]($asset/$APPIMAGE_PKG.sha256) | Portable for SteamOS / Bazzite / immutable distros; Gear Lever & AppImageUpdate compatible |"
            echo "| Debian / Ubuntu / Mint | [.deb]($asset/$DEB_PKG) | Install with apt |"
            echo "| Arch Linux | [.pkg.tar.zst]($asset/$ARCH_PKG) · [PKGBUILD]($asset/PKGBUILD) | Install with pacman -U |"
            echo "| Fedora | [.rpm]($asset/$RPM_PKG) | Install with dnf |"
            echo "| Linux x86-64 (experimental) | [.flatpak]($asset/$FLATPAK_PKG) · [SHA-256]($asset/$FLATPAK_PKG.sha256) | Install with flatpak install --user; use a native package or AppImage for Steam and Proton integration |"
            echo "| Generic Linux x86-64 | [.tar.gz]($asset/Aurora-Linux-x86_64.tar.gz) · [SHA-256]($asset/Aurora-Linux-x86_64.tar.gz.sha256) | Extract and launch aurora |"
            echo
          } > notes.md
          ls -l dist

      - name: Tag and publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Aurora ${{ needs.version.outputs.version }}${{ needs.version.outputs.prerelease == 'true' && format(' (test {0})', github.run_number) || '' }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes.md
          generate_release_notes: true
