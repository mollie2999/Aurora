[package]
name = "ui"
description = "Design system: theme tokens, presets and reusable widgets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = { workspace = true, features = ["serde"] }
serde.workspace = true
i18n.workspace = true
memmap2 = "0.9"
# Renders the Aurora SVG into the window/tray icon (same resvg egui_extras uses).
resvg = { version = "0.45", default-features = false }
eframe.workspace = true
log = "0.4"
# Match epaint's parser when checking theme-provided font faces.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

# winit needs a windowing system on Linux and FreeBSD (same as the apps).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

# Direct3D 12 renderer, used when OpenGL can't start (see src/native.rs).
[target.'cfg(windows)'.dependencies]
eframe = { workspace = true, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12"] }

[dev-dependencies]
image.workspace = true
