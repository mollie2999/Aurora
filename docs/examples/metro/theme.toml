[meta]
id = "metro"
name = "Metro"
version = "1.0.2"
author = "Aurora (after MetroSteam by RoseTheFlower)"
description = "Port of the MetroSteam skin: one flat 38px black title bar, square corners, Segoe-style type and solid accent selection."

[fonts]
# Selawik is Microsoft's open-source, metric-compatible stand-in for Segoe UI
# (Segoe UI itself cannot be redistributed). Semibold doubles as Metro's bold.
regular = "assets/fonts/Selawik-Regular.ttf"
bold = "assets/fonts/Selawik-Semibold.ttf"

[theme]
base = "OLED"
dark = true

# MetroSteam CSS variables, flattened onto pure black:
#   --clientBG / --header_dark / --bgGameList / --frameBorder = 0,0,0
#   white05 / white12 / white24 overlays on black -> raised / surface / hover
bg = "#000000"
chrome = "#000000"
surface = "#1F1F1F"
surface_hover = "#3D3D3D"
raised = "#0D0D0D"
border = "#000000"

text = "#FFFFFF"     # --white
text_dim = "#808080" # --white50
text_faint = "#737373" # --white45

accent = "#6624E2"   # --focus (Metro default purple)
accent_2 = "#7028F9" # --focus at brightness(1.1), Metro's hover
on_accent = "#FFFFFF"

play = "#6624E2"     # Metro paints the Play button with --focus
online = "#5DB2FF"
in_game = "#82BA00"
away = "#FFD24C"     # yellow, so Away reads apart from Online
danger = "#E81223"   # Windows 10 close-button red
discount = "#4C6B22"

radius = 0
weight_preset = "balanced"
font_scale = 1.0

# ---------------------------------------------------------------------------
# Options mirroring MetroSteam's Millennium settings
# ---------------------------------------------------------------------------

[options.variation]
kind = "select"
label = "Variation"
description = "MetroSteam's colour variations."
default = "standard"

[[options.variation.choices]]
value = "standard"
label = "Standard"

[[options.variation.choices]]
value = "dark"
label = "Dark"
[options.variation.choices.overrides.theme]
chrome = "#0C0C0C"
border = "#404040"
raised = "#181818"

[[options.variation.choices]]
value = "midnight"
label = "Midnight"
[options.variation.choices.overrides.theme]
chrome = "#00162D"
border = "#171366"
raised = "#000E2D"

[[options.variation.choices]]
value = "white"
label = "White"
[options.variation.choices.overrides.theme]
dark = false
bg = "#E6E6E6"
chrome = "#FFFFFF"
surface = "#CACACA"
surface_hover = "#AFAFAF"
raised = "#DADADA"
border = "#A0A0A0"
text = "#000000"
text_dim = "#737373"
text_faint = "#8A8A8A"
online = "#4268FF"
in_game = "#5E960F"
away = "#B88A00"

[options.accent]
kind = "select"
label = "Accent Color"
description = "MetroSteam's accent presets (--focus)."
default = "default"

[[options.accent.choices]]
value = "default"
label = "Default (Purple)"

[[options.accent.choices]]
value = "blue"
label = "Blue"
[options.accent.choices.overrides.theme]
