# Declarative Steam Desktop Client Layout for Aurora
# Defines both the global [[shell]] chrome and the [[library]] view tree.

# ============================================================================
# SHELL
# ============================================================================

# Top two-row Steam header (80px)
[[shell]]
type = "panel"
side = "top"
size = 80
drag_window = true
style = { bg = "$chrome", border_bottom = { width = 1, color = "$border" } }

# Row 1 (32px): logo + Aurora/View/Friends/Games/Help menus + account & window controls
[[shell.children]]
type = "row"
align = "center"
style = { height = 32, padding = [0, 6, 0, 14], gap = 4 }

[[shell.children.children]]
type = "logo"
size = 16

[[shell.children.children]]
type = "menu"
label = "Aurora"
style = { font_size = 12, color = "$text_dim", hover_color = "$text", padding = [2, 6, 2, 2] }
items = [
    { label = "Settings", action = "navigate:settings" },
    { label = "Downloads", action = "navigate:downloads" },
    { label = "Support", action = "open_url:https://help.steampowered.com" },
    "separator",
    { label = "Activate a product...", action = "activate_product" },
    { label = "Check for updates", action = "check_updates" },
    "separator",
    { label = "Switch account...", action = "logout" },
    { label = "Exit", action = "exit" },
]

[[shell.children.children]]
type = "menu"
label = "View"
style = { font_size = 12, color = "$text_dim", hover_color = "$text", padding = [2, 6, 2, 2] }
items = [
    { label = "Library", icon = "books", action = "navigate:library" },
    { label = "Hidden Games", icon = "eye_slash", action = "navigate:library:hidden" },
    { label = "Soundtracks", icon = "music", action = "navigate:library:soundtracks" },
    { label = "Downloads", icon = "download", action = "navigate:downloads" },
    "separator",
    { label = "Small Mode", icon = "list", action = "toggle_small_mode" },
    { label = "Big Picture Mode", icon = "monitor", action = "big_picture" },
    "separator",
    { label = "Friends List", icon = "users", action = "open_friends" },
    { label = "Players", icon = "clock", action = "navigate:community:players" },
    { label = "Game Servers", icon = "globe", action = "navigate:servers" },
    { label = "Screenshots", icon = "camera", action = "navigate:screenshots" },
    { label = "Inventory", icon = "backpack", action = "navigate:inventory" },
    { label = "Update News", icon = "note", action = "navigate:library:news" },
    "separator",
    { label = "Settings", icon = "gear", action = "navigate:settings" },
]

[[shell.children.children]]
type = "menu"
label = "Friends"
style = { font_size = 12, color = "$text_dim", hover_color = "$text", padding = [2, 6, 2, 2] }
items = [
    { label = "Friends & Chat", action = "open_friends" },
    { label = "All Friends", action = "navigate:friends" },
]

[[shell.children.children]]
type = "menu"
label = "Games"
style = { font_size = 12, color = "$text_dim", hover_color = "$text", padding = [2, 6, 2, 2] }
items = [
    { label = "View Games Library", action = "navigate:library" },
    { label = "Activate a Product...", action = "activate_product" },
    { label = "Add a Non-Steam Game...", action = "add_game" },
]

[[shell.children.children]]
type = "menu"
label = "Help"
style = { font_size = 12, color = "$text_dim", hover_color = "$text", padding = [2, 6, 2, 2] }
items = [
    { label = "Steam Support", action = "open_url:https://help.steampowered.com" },
    { label = "Check for Updates...", action = "check_updates" },
]

[[shell.children.children]]
type = "spacer"
flex = true

[[shell.children.children]]
type = "friends_button"
icon = "users"
size = 24
style = { width = 40, bg = "$accent", color = "$on_accent", radius = 2 }

[[shell.children.children]]
type = "notifications"
size = 24
highlight_unread_bg = "$discount"
style = { width = 40, bg = "$bg", radius = 2 }

[[shell.children.children]]
type = "account"
show_avatar = true
show_name = true
show_wallet = true
show_caret = true
avatar_size = 24
style = { height = 24, font_size = 12, bg = "$bg", radius = 2, padding = [0, 8, 0, 0] }

[[shell.children.children]]
type = "window_controls"
variant = "windows"
height = 32

# Row 2 (48px): back/forward arrows + bold uppercase underline navigation tabs
[[shell.children]]
type = "row"
align = "center"
style = { height = 36, padding = [0, 12, 12, 10], gap = 8 }

[[shell.children.children]]
type = "back_forward"
size = 24

[[shell.children.children]]
type = "nav_tabs"
direction = "horizontal"
show_icons = false
uppercase = true
profile_as_username = true
indicator = "underline"
indicator_height = 2.5
tab_gap = 12
style = { font_size = 18, font_weight = "bold", color = "$text", hover_color = "$text", active_color = "$accent" }

# Bottom Aurora status bar (40px)
[[shell]]
type = "panel"
side = "bottom"
size = 40
style = { bg = "$chrome", border_top = { width = 1, color = "$border" }, padding = [0, 14, 0, 14] }

[[shell.children]]
type = "row"
align = "center"
style = { height = "fill", gap = 8 }

[[shell.children.children]]
type = "button"
label = "Add a Game"
icon = "plus_box"
action = "add_game"
style = { font_size = 12.5, color = "$text_dim", hover_color = "$text", bg = "transparent", padding = [4, 4, 4, 4] }

[[shell.children.children]]
type = "spacer"
flex = true

[[shell.children.children]]
type = "downloads_bar"
width = 420
style = { height = 32 }

[[shell.children.children]]
type = "spacer"
flex = true

[[shell.children.children]]
type = "button"
label = "Friends & Chat"
icon = "friends_box"
action = "open_friends"
style = { font_size = 12.5, color = "$text_dim", hover_color = "$text", bg = "transparent", padding = [4, 4, 4, 4] }

# Dockable Friends & Chat drawer
[[shell]]
type = "friends_drawer"
width = 290

# Center page host
[[shell]]
type = "panel"
side = "center"
style = { bg = "$bg" }

[[shell.children]]
type = "page_content"

# ============================================================================
# LIBRARY
# ============================================================================

# Left compact Steam library sidebar (276px).
# Every color follows semantic palette roles so all Steam eras stay coherent.
[[library]]
type = "panel"
side = "left"
size = 276
style = { bg = "$bg", border_right = { width = 1, color = "$border" }, padding = [4, 6, 0, 6], gap = 6 }

[[library.children]]
type = "row"
align = "center"
style = { height = 32, gap = 4 }

[[library.children.children]]
type = "button"
label = "Home"
action = "navigate:library"
style = { width = "fill", height = 32, bg = "$raised", active_bg = "$surface_hover", hover_bg = "$surface_hover", radius = 2, align = "start", padding = [0, 10, 0, 10], font_size = 13.5, font_weight = "medium", color = "$text" }

[[library.children.children]]
type = "button"
label = ""
icon = "grid"
action = "library:collections"
style = { width = 32, height = 32, bg = "$surface", hover_bg = "$surface_hover", radius = 2, align = "center", font_size = 15, color = "$text_dim", hover_color = "$text" }

[[library.children]]
type = "spacer"
size = 9

[[library.children]]
type = "library_filters"
variant = "dropdown_icons"

[[library.children]]
type = "library_search"
placeholder = "Search"
show_filter_button = true
style = { bg = "$chrome", radius = 0, height = 32 }

[[library.children]]
type = "spacer"
size = 2

[[library.children]]
type = "library_list"
group_by = "last_played"
row_height = 25
icon_size = 20
group_headers = true
show_counts = true
style = { font_size = 13 }

# Center library home shelves / game detail host
[[library]]
type = "panel"
side = "center"
style = { bg = "$bg" }

[[library.children]]
type = "library_home_or_detail"

[[library.children.children]]
type = "scroll"
direction = "vertical"

# Raised news band fades into the selected era's chrome.
[[library.children.children.children]]
type = "box"
style = { bg_gradient = { from = "$raised", to = "$chrome", direction = "vertical" }, border_bottom = { width = 1, color = "$border" }, padding = [16, 24, 28, 24] }

[[library.children.children.children.children]]
type = "whats_new_shelf"
title = "What's New"
card_width = 318
card_height = 179
card_radius = 4
date_above = true
max_items = 12
gap = 16

# The main shelves keep the selected era's surface-to-background depth.
[[library.children.children.children]]
type = "box"
style = { bg_gradient = { from = "$surface", to = "$bg", direction = "vertical" }, padding = [43, 24, 24, 24], gap = 40 }

[[library.children.children.children.children]]
type = "recent_games_shelf"
title = "Recent Games"
featured_first = true
featured_width = 376
capsule_width = 179
capsule_height = 268
card_radius = 0
gap = 16

[[library.children.children.children.children]]
type = "all_games_grid"
title = "All Games"
show_count = true
show_sort = true
card_aspect = "capsule"
card_width = 224
card_height = 336
card_radius = 0
gap = 16
